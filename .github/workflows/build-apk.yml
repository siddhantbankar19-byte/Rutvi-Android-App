name: Build Rutvi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o Rutvi_Android_App_Project.zip

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        run: gradle -p Rutvi_Android_App assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rutvi-Automation-Controls-APK
          path: Rutvi_Android_App/app/build/outputs/apk/debug/app-debug.apk
